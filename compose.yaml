name: mini-sportsbook

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      LINE_DB_PASSWORD: ${LINE_DB_PASSWORD:-line}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-wallet}
      BETS_DB_PASSWORD: ${BETS_DB_PASSWORD:-bets}
      BUILD_METRICS_DB_PASSWORD: ${BUILD_METRICS_DB_PASSWORD:-build_metrics}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-sportsbook.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  contract-check:
    profiles: [contract-check]
    build:
      context: .
      dockerfile: tools/contract-check/Dockerfile

  contract-check-grpc:
    profiles: [contract-check]
    build:
      context: .
      dockerfile: tools/contract-check-grpc/Dockerfile
    ports:
      - "9091:9091"

  swagger-ui:
    profiles: [contract-check]
    image: swaggerapi/swagger-ui:v5.30.3
    environment:
      SWAGGER_JSON_URL: /docs/openapi.yaml

  nginx:
    profiles: [contract-check]
    image: nginx:1.29.4-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx:/etc/nginx/conf.d:ro
      - ./contracts/openapi:/etc/nginx/contracts:ro
    depends_on:
      - contract-check
      - swagger-ui

volumes:
  postgres_data:
