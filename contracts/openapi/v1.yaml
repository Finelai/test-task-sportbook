openapi: 3.0.3
info:
  title: Mini Sportsbook API
  version: 1.0.0
  description: Публичный контракт мини-спортсбука.
paths:
  /api/v1/line:
    get:
      summary: Получить снимок линии
      operationId: getLine
      responses:
        '200':
          description: Снимок линии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineSnapshot'
              example:
                version: 1
                matches:
                  - matchId: match-1
                    homeTeam: Home FC
                    awayTeam: Away FC
                    open: true
                    quotes:
                      - {outcome: HOME, odds: '2.10'}
                      - {outcome: DRAW, odds: '3.20'}
                      - {outcome: AWAY, odds: '3.50'}
        '503':
          description: Линия временно недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {code: unavailable, message: Line is temporarily unavailable}
  /api/v1/line/events:
    get:
      summary: Подписаться на обновления линии
      description: |
        Поток SSE отправляет событие snapshot с полным снимком при каждом
        подключении и переподключении, затем события match_updated с полным
        состоянием изменённого матча. Клиент заменяет локальный снимок при
        получении snapshot.
      operationId: getLineEvents
      responses:
        '200':
          description: Поток событий snapshot и match_updated
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LineSnapshot'
                  - $ref: '#/components/schemas/MatchUpdated'
              examples:
                snapshot:
                  summary: Начальный полный снимок
                  value: |
                    event: snapshot
                    data: {"version":1,"matches":[{"matchId":"match-1","homeTeam":"Home FC","awayTeam":"Away FC","open":true,"quotes":[{"outcome":"HOME","odds":"2.10"},{"outcome":"DRAW","odds":"3.20"},{"outcome":"AWAY","odds":"3.50"}]}]}

                match_updated:
                  summary: Полное состояние изменённого матча
                  value: |
                    event: match_updated
                    data: {"version":2,"match":{"matchId":"match-1","homeTeam":"Home FC","awayTeam":"Away FC","open":true,"quotes":[{"outcome":"HOME","odds":"2.20"},{"outcome":"DRAW","odds":"3.20"},{"outcome":"AWAY","odds":"3.50"}]}}

  /api/v1/line/offers:
    post:
      summary: Получить предложение для исхода
      description: |
        Возвращает предложение для выбранного матча и исхода. Его срок действия
        и правила замены проверяются сервисом Линии.
      operationId: createOffer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferRequest'
            example: {matchId: match-1, outcome: HOME}
      responses:
        '200':
          description: Предложение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              example: {offerId: offer-1, matchId: match-1, outcome: HOME, odds: '2.10', expiresAt: '2030-01-01T00:01:00Z'}
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: invalid_request, message: Invalid request}
        '409':
          description: Рынок закрыт
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: market_closed, message: Market is closed}
        '503':
          description: Линия временно недоступна
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: unavailable, message: Line is temporarily unavailable}
  /api/v1/bets:
    post:
      summary: Создать ставку
      description: |
        Создаёт ставку по предложению. Временная недоступность сервиса
        не означает отказ ставки и не переводит её в статус rejected.
      operationId: createBet
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Ключ идемпотентности запроса
          schema: {type: string}
          example: bet-example-1
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBetRequest'}
            example: {offerId: offer-1, odds: '2.10', amount: '3.00'}
      responses:
        '202':
          description: Ставка принята в обработку
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bet'}
              example: {betId: bet-1, status: pending, amount: '3.00', odds: '2.10'}
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: invalid_request, message: Invalid request}
        '409':
          description: Конфликт параметров повторного запроса
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: idempotency_conflict, message: Idempotency key conflict}
        '503':
          description: Сервис временно недоступен; это не означает отказ ставки
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: unavailable, message: Service is temporarily unavailable}
  /api/v1/bets/{betId}:
    get:
      summary: Получить ставку
      operationId: getBet
      parameters:
        - name: betId
          in: path
          required: true
          description: Идентификатор ставки
          schema: {type: string}
          example: bet-1
      responses:
        '200':
          description: Ставка
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bet'}
              example: {betId: bet-1, status: pending, amount: '3.00', odds: '2.10'}
        '404':
          description: Ставка не найдена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: not_found, message: Bet not found}
        '503':
          description: Сервис временно недоступен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: unavailable, message: Service is temporarily unavailable}
components:
  schemas:
    CreateBetRequest:
      type: object
      required: [offerId, odds, amount]
      properties:
        offerId: {type: string, example: offer-1}
        odds: {type: string, example: '2.10'}
        amount: {type: string, example: '3.00'}
    Bet:
      description: Ставка в обработке, принятая или отклонённая.
      oneOf:
        - $ref: '#/components/schemas/ActiveBet'
        - $ref: '#/components/schemas/RejectedBet'
    ActiveBet:
      type: object
      required: [betId, status, amount, odds]
      properties:
        betId: {type: string, example: bet-1}
        status: {type: string, enum: [pending, accepted]}
        amount: {type: string, example: '3.00'}
        odds: {type: string, example: '2.10'}
    RejectedBet:
      type: object
      required: [betId, status, amount, odds, reason]
      properties:
        betId: {type: string, example: bet-1}
        status: {type: string, enum: [rejected]}
        amount: {type: string, example: '3.00'}
        odds: {type: string, example: '2.10'}
        reason:
          type: string
          enum: [offer_expired, odds_changed, offer_unavailable, offer_mismatch, market_closed, insufficient_funds]
    OfferRequest:
      type: object
      required: [matchId, outcome]
      properties:
        matchId: {type: string, example: match-1}
        outcome: {type: string, enum: [HOME, DRAW, AWAY]}
    Offer:
      type: object
      required: [offerId, matchId, outcome, odds, expiresAt]
      properties:
        offerId: {type: string, example: offer-1}
        matchId: {type: string, example: match-1}
        outcome: {type: string, enum: [HOME, DRAW, AWAY]}
        odds: {type: string, example: '2.10'}
        expiresAt: {type: string, format: date-time, description: Время окончания действия в UTC, example: '2030-01-01T00:01:00Z'}
    LineSnapshot:
      type: object
      required: [version, matches]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        matches:
          type: array
          items: {$ref: '#/components/schemas/Match'}
    MatchUpdated:
      type: object
      required: [version, match]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        match: {$ref: "#/components/schemas/Match"}
    Match:
      type: object
      required: [matchId, homeTeam, awayTeam, open, quotes]
      properties:
        matchId: {type: string}
        homeTeam: {type: string}
        awayTeam: {type: string}
        open: {type: boolean}
        quotes:
          type: array
          minItems: 3
          maxItems: 3
          description: Котировки HOME, DRAW и AWAY, по одной для каждого исхода.
          items: {$ref: '#/components/schemas/Quote'}
    Quote:
      type: object
      required: [outcome, odds]
      properties:
        outcome: {type: string, enum: [HOME, DRAW, AWAY]}
        odds: {type: string, example: '2.10'}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
