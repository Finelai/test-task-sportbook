server {
    listen 8080;
    location = /docs { return 301 /docs/; }
    location = /docs/openapi.yaml {
        alias /etc/nginx/contracts/v1.yaml;
        default_type application/yaml;
    }
    location /docs/ {
        proxy_pass http://swagger-ui:8080/;
    }
    location = /api/v1/bets {
        proxy_pass http://contract-check:8080;
    }
    location = /api/v1/line/offers {
        proxy_pass http://contract-check:8080;
    }
    location = /api/v1/line/events {
        proxy_pass http://contract-check:8080;
        proxy_buffering off;
        proxy_cache off;
    }
    location = /api/v1/line {
        proxy_pass http://contract-check:8080;
    }
}
